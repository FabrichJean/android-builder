<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>APK Builder</title>
<style>
  :root {
    --bg:        #14110b;
    --bg-glow:   #1d180f;
    --surface:   #1c180f;
    --surface-2: #221d13;
    --border:    rgba(224, 201, 141, 0.12);
    --border-2:  rgba(224, 201, 141, 0.22);
    --text:      #ece3d0;
    --muted:     #9c9079;
    --faint:     #6f6650;
    --sand:      #e0c07d;
    --sand-dim:  #c9a86a;
    --sand-soft: rgba(224, 192, 125, 0.12);
    --ok:        #a7cf95;
    --warn:      #e0c07d;
    --err:       #dd8b78;
    --radius:    14px;
    --shadow:    0 18px 50px -20px rgba(0,0,0,0.7);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1100px 600px at 50% -10%, var(--bg-glow), transparent 70%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    padding: clamp(20px, 5vw, 56px) 20px 80px;
    display: flex;
    justify-content: center;
  }

  .wrap { width: 100%; max-width: 560px; }

  /* ---- header ---- */
  header { text-align: center; margin-bottom: 34px; }
  .mark {
    width: 46px; height: 46px; margin: 0 auto 16px;
    display: grid; place-items: center;
    border-radius: 13px;
    background: linear-gradient(160deg, var(--sand), var(--sand-dim));
    color: #201a0e; font-size: 22px;
    box-shadow: 0 10px 26px -10px rgba(224,192,125,0.5);
  }
  h1 {
    font-size: 25px; font-weight: 650; margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .subtitle { color: var(--muted); font-size: 14.5px; margin: 0; }

  /* ---- card ---- */
  .card {
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
  }

  /* sélecteur de mode */
  .seg {
    display: flex; gap: 4px; margin-bottom: 18px;
    background: #100d08; border: 1px solid var(--border);
    border-radius: 11px; padding: 4px;
  }
  .seg button {
    flex: 1; border: none; background: transparent; cursor: pointer;
    color: var(--muted); font-size: 13.5px; font-weight: 550;
    padding: 9px; border-radius: 8px; font-family: inherit;
    transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button.active {
    background: var(--sand-soft); color: var(--sand);
  }

  /* zone d'upload */
  .drop {
    border: 1px dashed var(--border-2); border-radius: 11px;
    padding: 20px; text-align: center; cursor: pointer;
    color: var(--muted); font-size: 13.5px; background: #100d08;
    transition: border-color .15s, background .15s, color .15s;
  }
  .drop:hover, .drop.over { border-color: var(--sand); color: var(--sand); background: var(--sand-soft); }
  .drop strong { color: var(--text); font-weight: 600; }
  .drop .file-name { color: var(--sand); font-weight: 600; display: block; margin-top: 6px; }
  .drop input[type=file] { display: none; }

  .field { margin-bottom: 16px; }
  .field:last-of-type { margin-bottom: 0; }
  label {
    display: block; font-size: 12.5px; font-weight: 550;
    color: var(--muted); margin-bottom: 7px;
    letter-spacing: 0.01em;
  }
  .hint { color: var(--faint); font-weight: 450; }

  input {
    width: 100%;
    background: #100d08;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    padding: 11px 13px;
    border-radius: 10px;
    transition: border-color .15s, box-shadow .15s, background .15s;
    font-family: inherit;
  }
  input::placeholder { color: var(--faint); }
  input:focus {
    outline: none;
    border-color: var(--border-2);
    box-shadow: 0 0 0 3px var(--sand-soft);
    background: #130f09;
  }
  input:invalid:not(:placeholder-shown) { border-color: rgba(221,139,120,0.4); }

  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }

  /* advanced toggle */
  .adv-toggle {
    background: none; border: none; color: var(--sand-dim);
    font-size: 13px; cursor: pointer; padding: 6px 0; margin-top: 4px;
    font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
  }
  .adv-toggle:hover { color: var(--sand); }
  .adv-toggle .chev { transition: transform .2s; font-size: 10px; }
  .adv-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .adv { display: none; margin-top: 14px; }
  .adv.open { display: block; }

  button.submit {
    width: 100%; margin-top: 22px;
    background: linear-gradient(160deg, var(--sand), var(--sand-dim));
    color: #201a0e;
    font-size: 15px; font-weight: 650;
    border: none; border-radius: 11px;
    padding: 13px; cursor: pointer;
    transition: transform .08s, filter .15s, opacity .15s;
    font-family: inherit;
  }
  button.submit:hover { filter: brightness(1.05); }
  button.submit:active { transform: translateY(1px); }
  button.submit:disabled { opacity: .5; cursor: not-allowed; filter: none; }

  .form-error {
    color: var(--err); font-size: 13px; margin-top: 12px;
    min-height: 0; text-align: center;
  }

  /* ---- interrupteur (toggle) ---- */
  .switch-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    cursor: pointer; padding: 4px 0;
  }
  .switch-row .switch-label { font-size: 13.5px; color: var(--text); font-weight: 500; }
  .switch-row .switch-label small { display: block; font-size: 11.5px; color: var(--faint); font-weight: 400; margin-top: 1px; }
  .switch {
    position: relative; flex: none; width: 42px; height: 24px; border-radius: 999px;
    background: #100d08; border: 1px solid var(--border-2); transition: background .18s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%; background: var(--muted);
    transition: transform .18s, background .18s;
  }
  .switch-row input { position: absolute; opacity: 0; pointer-events: none; }
  .switch-row input:checked + .switch { background: var(--sand-soft); border-color: var(--sand); }
  .switch-row input:checked + .switch::after { transform: translateX(18px); background: var(--sand); }

  /* ---- apparence (icône + splash) ---- */
  .appearance { display: flex; gap: 16px; align-items: stretch; }
  .appearance-controls { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .icon-tile {
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    background: #100d08; border: 1px solid var(--border); border-radius: 12px;
    padding: 10px; color: var(--muted); font-family: inherit; text-align: left;
    transition: border-color .15s;
  }
  .icon-tile:hover { border-color: var(--border-2); }
  .icon-img {
    width: 46px; height: 46px; border-radius: 11px; flex: none;
    background: linear-gradient(160deg, #e6c98a, #c9a86a);
    background-size: cover; background-position: center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
  }
  .icon-edit { font-size: 13px; font-weight: 600; color: var(--text); }
  .icon-tile:hover .icon-edit { color: var(--sand); }

  .mini-label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 7px; }
  .color-row { display: flex; gap: 8px; align-items: center; }
  input[type=color] {
    -webkit-appearance: none; appearance: none; border: none; cursor: pointer;
    width: 46px; height: 40px; border-radius: 10px; background: none; padding: 0;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 1px solid var(--border-2); border-radius: 10px; }
  #splashHex {
    width: 100%; text-transform: uppercase; font-family: ui-monospace, monospace;
    font-size: 13px; padding: 10px 12px;
  }

  .phone { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .phone-screen {
    width: 96px; height: 190px; border-radius: 20px;
    border: 3px solid #2a241a; background: #14110b;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(0,0,0,.4), 0 10px 24px -12px rgba(0,0,0,.7);
    transition: background .2s;
  }
  .phone-icon {
    width: 52px; height: 52px; border-radius: 13px;
    background: linear-gradient(160deg, #e6c98a, #c9a86a);
    background-size: cover; background-position: center;
    box-shadow: 0 6px 16px -6px rgba(0,0,0,.6);
  }
  .phone-name { font-size: 11px; font-weight: 600; color: #ece3d0; max-width: 84px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phone-caption { font-size: 10.5px; color: var(--faint); letter-spacing: .05em; }

  /* ---- modal de crop ---- */
  .modal {
    position: fixed; inset: 0; z-index: 20; display: none;
    place-items: center; padding: 20px;
    background: rgba(8,6,4,.72); backdrop-filter: blur(3px);
  }
  .modal.open { display: grid; }
  .modal-card {
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border); border-radius: 16px; padding: 22px;
    width: 100%; max-width: 340px; box-shadow: var(--shadow);
    animation: pop .3s cubic-bezier(.2,1.2,.3,1);
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } }
  .modal-card h3 { font-size: 17px; margin-bottom: 4px; }
  .modal-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
  .crop-stage {
    position: relative; width: 288px; height: 288px; max-width: 100%;
    margin: 0 auto; border-radius: 12px; overflow: hidden; background: #0d0a06;
    touch-action: none; cursor: grab;
  }
  .crop-stage:active { cursor: grabbing; }
  #cropCanvas { display: block; width: 100%; height: 100%; }
  .crop-frame {
    position: absolute; inset: 0; pointer-events: none;
    box-shadow: 0 0 0 2000px rgba(20,17,11,.55);
    border: 2px solid rgba(224,192,125,.7); border-radius: 10px;
  }
  .zoom-row { display: flex; align-items: center; gap: 10px; margin: 16px 0 4px; color: var(--muted); }
  #zoom { flex: 1; accent-color: var(--sand); }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn-ghost, .btn-gold {
    flex: 1; border: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 600; padding: 11px; border-radius: 11px;
  }
  .btn-ghost { background: transparent; border: 1px solid var(--border-2); color: var(--muted); }
  .btn-ghost:hover { color: var(--text); }
  .btn-gold { background: linear-gradient(160deg, var(--sand), var(--sand-dim)); color: #201a0e; }

  /* ---- builds list ---- */
  .builds { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
  .builds-empty {
    text-align: center; color: var(--faint); font-size: 13.5px;
    padding: 24px 0;
  }

  .build {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
    animation: rise .3s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .build .info { flex: 1; min-width: 0; }
  .build .name {
    font-size: 14.5px; font-weight: 600; margin: 0 0 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .build .url {
    font-size: 12.5px; color: var(--muted); margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em;
    padding: 4px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .pill.pending  { color: var(--muted); background: rgba(156,144,121,0.12); }
  .pill.building { color: var(--warn);  background: rgba(224,192,125,0.13); }
  .pill.success  { color: var(--ok);    background: rgba(167,207,149,0.13); }
  .pill.failed   { color: var(--err);   background: rgba(221,139,120,0.13); }

  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  }
  .pill.building .dot,
  .pill.pending .dot { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* progression temps réel */
  .progress-wrap { margin-top: 10px; }
  .progress-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px; gap: 10px;
  }
  .progress-step {
    font-size: 12.5px; color: var(--sand-dim); font-weight: 550;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .progress-pct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .track {
    height: 5px; border-radius: 999px; background: rgba(224,192,125,0.10);
    overflow: hidden;
  }
  .track > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--sand-dim), var(--sand));
    border-radius: 999px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }

  .steps {
    list-style: none; margin: 12px 0 0; padding: 0;
    display: flex; flex-direction: column; gap: 5px;
  }
  .steps li {
    display: flex; align-items: center; gap: 9px;
    font-size: 12.5px; color: var(--faint);
    transition: color .2s;
  }
  .steps li.done { color: var(--muted); }
  .steps li.active { color: var(--text); font-weight: 550; }
  .steps li.failed { color: var(--err); }
  .step-ic {
    width: 15px; height: 15px; flex: none;
    display: grid; place-items: center; font-size: 10px;
    border-radius: 50%;
  }
  .step-ic.queued { color: var(--faint); border: 1px solid var(--border-2); }
  .step-ic.done   { color: var(--ok); }
  .step-ic.failed { color: var(--err); }
  .step-ic.active {
    border: 1.5px solid var(--sand); border-top-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .top { display: flex; align-items: center; gap: 14px; width: 100%; }
  .top .info { flex: 1; min-width: 0; }
  .build.expanded { flex-direction: column; align-items: stretch; }

  .actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    display: grid; place-items: center;
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; text-decoration: none;
    transition: color .15s, border-color .15s, background .15s;
    font-size: 15px;
  }
  .icon-btn:hover { color: var(--sand); border-color: var(--border-2); background: var(--sand-soft); }
  .icon-btn.primary { color: #201a0e; background: var(--sand); border-color: transparent; }
  .icon-btn.primary:hover { filter: brightness(1.06); }

  footer {
    text-align: center; margin-top: 40px;
    color: var(--faint); font-size: 12px;
  }
  footer code { color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mark">◨</div>
      <h1>APK Builder</h1>
      <p class="subtitle">Transforme une URL en application Android WebView.</p>
    </header>

    <div class="card">
      <form id="form" novalidate>
        <div class="seg" id="seg">
          <button type="button" data-mode="url" class="active">URL distante</button>
          <button type="button" data-mode="bundle">Projet web (dist)</button>
        </div>

        <div class="field" id="urlField">
          <label for="url">URL du site</label>
          <input id="url" type="url" placeholder="https://exemple.com" />
        </div>

        <div class="field" id="distField" style="display:none">
          <label>Build / dist du projet web <span class="hint">— .zip contenant index.html</span></label>
          <label class="drop" id="drop">
            <strong>Cliquer ou déposer</strong> un fichier .zip
            <span class="file-name" id="fileName"></span>
            <input id="dist" type="file" accept=".zip,application/zip" />
          </label>
        </div>

        <div class="field">
          <label for="name">Nom de l'application</label>
          <input id="name" type="text" placeholder="Mon Application" required maxlength="60" />
        </div>

        <div class="field">
          <label>Apparence <span class="hint">— icône & écran de démarrage</span></label>
          <div class="appearance">
            <div class="appearance-controls">
              <button type="button" class="icon-tile" id="iconTile" title="Choisir une icône">
                <span class="icon-img" id="iconImg"></span>
                <span class="icon-edit">Icône</span>
              </button>
              <div class="splash-ctl">
                <span class="mini-label">Fond du splash</span>
                <div class="color-row">
                  <input type="color" id="splashColor" value="#14110b" />
                  <input type="text" id="splashHex" value="#14110B" maxlength="7" spellcheck="false" />
                </div>
              </div>
            </div>
            <div class="phone" id="phone">
              <div class="phone-screen" id="phoneScreen">
                <span class="phone-icon" id="phoneIcon"></span>
                <span class="phone-name" id="phoneName">Mon Application</span>
              </div>
              <span class="phone-caption">Aperçu du splash</span>
            </div>
          </div>
          <input id="icon" type="file" accept="image/*" hidden />
        </div>

        <button type="button" class="adv-toggle" id="advToggle" aria-expanded="false">
          <span class="chev">▶</span> Options avancées
        </button>
        <div class="adv" id="adv">
          <div class="field">
            <label for="pkg">Identifiant du package <span class="hint">— déduit du nom si vide</span></label>
            <input id="pkg" type="text" placeholder="app.webview.monapplication"
                   pattern="[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+" />
          </div>
          <div class="row">
            <div class="field">
              <label for="vname">Version (nom)</label>
              <input id="vname" type="text" placeholder="1.0" pattern="[A-Za-z0-9._-]+" />
            </div>
            <div class="field">
              <label for="vcode">Version (code)</label>
              <input id="vcode" type="text" placeholder="1" pattern="[0-9]+" inputmode="numeric" />
            </div>
          </div>
          <label class="switch-row">
            <span class="switch-label">Masquer la barre de défilement
              <small>Cache le scrollbar de la WebView</small>
            </span>
            <input type="checkbox" id="hideScrollbar" />
            <span class="switch"></span>
          </label>
        </div>

        <button type="submit" class="submit" id="submit">Générer l'APK</button>
        <div class="form-error" id="formError"></div>
      </form>
    </div>

    <div class="builds" id="builds"></div>

    <footer>Les APK produits sont aussi enregistrés dans <code>releases/</code>.</footer>
  </div>

  <!-- modal de recadrage d'icône -->
  <div class="modal" id="cropModal">
    <div class="modal-card">
      <h3>Recadrer l'icône</h3>
      <p class="modal-sub">Déplace l'image, ajuste le zoom. L'icône sera carrée.</p>
      <div class="crop-stage" id="cropStage">
        <canvas id="cropCanvas" width="288" height="288"></canvas>
        <div class="crop-frame"></div>
      </div>
      <div class="zoom-row">
        <span>−</span>
        <input type="range" id="zoom" min="1" max="4" step="0.01" value="1" />
        <span>+</span>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cropCancel">Annuler</button>
        <button type="button" class="btn-gold" id="cropOk">Valider</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const form = $("form"), submit = $("submit"), formError = $("formError"), buildsEl = $("builds");
  const STORE_KEY = "apk-builder-builds";

  const STATUS = {
    pending:  { label: "En attente",  cls: "pending"  },
    building: { label: "Compilation", cls: "building" },
    success:  { label: "Prêt",        cls: "success"  },
    failed:   { label: "Échec",       cls: "failed"   },
  };
  const isTerminal = (s) => s === "success" || s === "failed";

  let builds = load();

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch { return []; }
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(builds)); }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
  }

  function stepClasses(step) {
    if (step.status === "in_progress") return { li: "active", ic: "active", txt: "" };
    if (step.status === "completed") {
      if (step.conclusion === "failure") return { li: "failed", ic: "failed", txt: "✕" };
      return { li: "done", ic: "done", txt: "✓" };
    }
    return { li: "", ic: "queued", txt: "·" };
  }

  function renderProgress(b) {
    const pct = Math.max(0, Math.min(100, b.progress || 0));
    const stepLabel = b.current_step || (b.status === "pending" ? "Démarrage du workflow…" : "En cours…");
    const steps = (b.steps || []).map(s => {
      const c = stepClasses(s);
      return `<li class="${c.li}"><span class="step-ic ${c.ic}">${c.txt}</span>${esc(s.name)}</li>`;
    }).join("");
    return `
      <div class="progress-wrap">
        <div class="progress-head">
          <span class="progress-step">${esc(stepLabel)}</span>
          <span class="progress-pct">${pct}%</span>
        </div>
        <div class="track"><span style="width:${pct}%"></span></div>
        ${steps ? `<ul class="steps">${steps}</ul>` : ""}
      </div>`;
  }

  function render() {
    if (!builds.length) {
      buildsEl.innerHTML = `<div class="builds-empty">Aucun build pour l'instant.</div>`;
      return;
    }
    buildsEl.innerHTML = builds.map(b => {
      const st = STATUS[b.status] || STATUS.pending;
      const active = b.status === "pending" || b.status === "building";
      const download = b.status === "success"
        ? `<a class="icon-btn primary" href="/api/builds/${b.id}/apk" title="Télécharger l'APK" download>↓</a>`
        : "";
      const runLink = b.run_url
        ? `<a class="icon-btn" href="${esc(b.run_url)}" target="_blank" rel="noopener" title="Voir le run">↗</a>`
        : "";
      const remove = `<button class="icon-btn" data-remove="${b.id}" title="Retirer de la liste">✕</button>`;
      const err = b.status === "failed" && b.error
        ? `<p class="url" style="color:var(--err)" title="${esc(b.error)}">${esc(b.error)}</p>` : "";
      const sub = b.mode === "bundle" ? `▣ ${esc(b.url)} · hors-ligne` : esc(b.url);
      const top = `
        <div class="top">
          <div class="info">
            <p class="name">${esc(b.app_name)}</p>
            ${err || `<p class="url">${sub}</p>`}
          </div>
          <span class="pill ${st.cls}"><span class="dot"></span>${st.label}</span>
          <div class="actions">${download}${runLink}${remove}</div>
        </div>`;
      return `<div class="build${active ? " expanded" : ""}">${top}${active ? renderProgress(b) : ""}</div>`;
    }).join("");
  }

  buildsEl.addEventListener("click", (e) => {
    const id = e.target.getAttribute?.("data-remove");
    if (id) { builds = builds.filter(b => b.id !== id); save(); render(); }
  });

  const streams = new Map();

  // Souscription temps réel via Server-Sent Events.
  function subscribe(id) {
    if (streams.has(id)) return;
    const es = new EventSource(`/api/builds/${id}/events`);
    streams.set(id, es);
    es.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }
      const b = builds.find(x => x.id === id);
      if (!b) { es.close(); streams.delete(id); return; }
      Object.assign(b, {
        status: data.status,
        run_url: data.run_url || b.run_url,
        error: data.error || "",
        progress: data.progress || 0,
        current_step: data.current_step || "",
        steps: data.steps || [],
      });
      save(); render();
      if (isTerminal(b.status)) { es.close(); streams.delete(id); }
    };
    // Les erreurs de connexion sont gérées par la reconnexion auto d'EventSource.
  }

  $("advToggle").addEventListener("click", (e) => {
    const t = e.currentTarget;
    const open = t.getAttribute("aria-expanded") === "true";
    t.setAttribute("aria-expanded", String(!open));
    $("adv").classList.toggle("open", !open);
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    formError.textContent = "";

    const appName = $("name").value.trim();
    const pkg = $("pkg").value.trim();
    const vname = $("vname").value.trim(), vcode = $("vcode").value.trim();

    if (!appName) return fail("Le nom de l'application est requis.");
    if (pkg && !/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(pkg)) return fail("Package invalide (ex. com.exemple.monapp).");

    // Toujours en multipart : permet d'inclure icône + couleur de splash uniformément.
    const fd = new FormData();
    fd.append("app_name", appName);
    if (pkg) fd.append("package", pkg);
    if (vname) fd.append("version_name", vname);
    if (vcode) fd.append("version_code", vcode);
    fd.append("splash_bg", splashHex());
    fd.append("hide_scrollbar", $("hideScrollbar").checked ? "true" : "false");
    if (iconBlob) fd.append("icon", iconBlob, "icon.png");

    let fetchOpts, listURL;
    if (mode === "bundle") {
      const f = $("dist").files[0];
      if (!f) return fail("Sélectionne un fichier .zip contenant index.html.");
      fd.append("dist", f);
      fetchOpts = { method: "POST", body: fd };
      listURL = f.name;
    } else {
      const url = $("url").value.trim();
      if (!/^https?:\/\//.test(url)) return fail("L'URL doit commencer par http:// ou https://");
      fd.append("url", url);
      fetchOpts = { method: "POST", body: fd };
      listURL = url;
    }

    submit.disabled = true; submit.textContent = "Envoi…";
    try {
      const res = await fetch("/api/builds", fetchOpts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erreur serveur");

      builds.unshift({
        id: data.id, status: data.status || "pending",
        url: listURL, app_name: appName, mode,
      });
      save(); render(); subscribe(data.id);
      form.reset(); setFileName(""); clearIcon(); syncSplash(); updatePreview();
    } catch (err) {
      fail(err.message);
    } finally {
      submit.disabled = false; submit.textContent = "Générer l'APK";
    }
  });

  function fail(msg) { formError.textContent = msg; }

  // ---- icône + splash + aperçu ----
  let iconBlob = null, iconURL = null;
  const splashColor = $("splashColor"), splashHexInput = $("splashHex");

  function splashHex() {
    const v = splashHexInput.value.trim();
    return /^#[0-9a-fA-F]{6}$/.test(v) ? v : splashColor.value;
  }
  function clearIcon() {
    iconBlob = null;
    if (iconURL) { URL.revokeObjectURL(iconURL); iconURL = null; }
    $("iconImg").style.backgroundImage = "";
    $("phoneIcon").style.backgroundImage = "";
  }
  function setIcon(blob) {
    if (iconURL) URL.revokeObjectURL(iconURL);
    iconBlob = blob; iconURL = URL.createObjectURL(blob);
    $("iconImg").style.backgroundImage = `url(${iconURL})`;
    $("phoneIcon").style.backgroundImage = `url(${iconURL})`;
  }
  function updatePreview() {
    $("phoneScreen").style.background = splashHex();
    $("phoneName").textContent = $("name").value.trim() || "Mon Application";
  }
  function syncSplash() {
    // aligne le champ hexa sur le sélecteur de couleur
    splashHexInput.value = splashColor.value.toUpperCase();
  }

  splashColor.addEventListener("input", () => { syncSplash(); updatePreview(); });
  splashHexInput.addEventListener("input", () => {
    const v = splashHexInput.value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { splashColor.value = v; updatePreview(); }
  });
  $("name").addEventListener("input", updatePreview);

  // --- cropper ---
  const cropModal = $("cropModal"), cropCanvas = $("cropCanvas"), cctx = cropCanvas.getContext("2d");
  const VIEW = 288;
  let cImg = null, cScale = 1, cMin = 1, cx = 0, cy = 0, dragging = false, lastX = 0, lastY = 0;

  $("iconTile").addEventListener("click", () => $("icon").click());
  $("icon").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => { openCropper(img); URL.revokeObjectURL(img.src); };
    img.onerror = () => fail("Image illisible.");
    img.src = URL.createObjectURL(f);
    e.target.value = ""; // permet de re-sélectionner le même fichier
  });

  function openCropper(img) {
    cImg = img;
    cMin = Math.max(VIEW / img.width, VIEW / img.height);
    cScale = cMin;
    $("zoom").min = cMin; $("zoom").max = cMin * 4; $("zoom").value = cMin;
    cx = (VIEW - img.width * cScale) / 2;
    cy = (VIEW - img.height * cScale) / 2;
    drawCrop();
    cropModal.classList.add("open");
  }
  function clampCrop() {
    const w = cImg.width * cScale, h = cImg.height * cScale;
    cx = Math.min(0, Math.max(VIEW - w, cx));
    cy = Math.min(0, Math.max(VIEW - h, cy));
  }
  function drawCrop() {
    clampCrop();
    cctx.clearRect(0, 0, VIEW, VIEW);
    cctx.drawImage(cImg, cx, cy, cImg.width * cScale, cImg.height * cScale);
  }
  $("zoom").addEventListener("input", (e) => {
    const ns = +e.target.value, k = ns / cScale;
    // zoom centré
    cx = VIEW / 2 - (VIEW / 2 - cx) * k;
    cy = VIEW / 2 - (VIEW / 2 - cy) * k;
    cScale = ns; drawCrop();
  });
  function cpt(e) { const r = cropCanvas.getBoundingClientRect();
    const s = VIEW / r.width; const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * s, y: (p.clientY - r.top) * s }; }
  function dStart(e) { dragging = true; const p = cpt(e); lastX = p.x; lastY = p.y; }
  function dMove(e) { if (!dragging) return; e.preventDefault(); const p = cpt(e);
    cx += p.x - lastX; cy += p.y - lastY; lastX = p.x; lastY = p.y; drawCrop(); }
  function dEnd() { dragging = false; }
  cropCanvas.addEventListener("mousedown", dStart);
  window.addEventListener("mousemove", dMove);
  window.addEventListener("mouseup", dEnd);
  cropCanvas.addEventListener("touchstart", dStart, { passive: false });
  cropCanvas.addEventListener("touchmove", dMove, { passive: false });
  cropCanvas.addEventListener("touchend", dEnd);

  $("cropCancel").addEventListener("click", () => cropModal.classList.remove("open"));
  $("cropOk").addEventListener("click", () => {
    const out = document.createElement("canvas"); out.width = out.height = 512;
    const octx = out.getContext("2d");
    const k = 512 / VIEW;
    octx.drawImage(cImg, cx * k, cy * k, cImg.width * cScale * k, cImg.height * cScale * k);
    out.toBlob((blob) => { if (blob) setIcon(blob); }, "image/png");
    cropModal.classList.remove("open");
  });

  syncSplash(); updatePreview();

  // ---- bascule de mode (URL / bundle) ----
  let mode = "url";
  function setFileName(name) {
    $("fileName").textContent = name || "";
  }
  $("seg").addEventListener("click", (e) => {
    const m = e.target.getAttribute("data-mode");
    if (!m || m === mode) return;
    mode = m;
    [...$("seg").children].forEach(b => b.classList.toggle("active", b.getAttribute("data-mode") === m));
    $("urlField").style.display  = m === "url" ? "" : "none";
    $("distField").style.display = m === "bundle" ? "" : "none";
    formError.textContent = "";
  });

  const drop = $("drop"), distInput = $("dist");
  distInput.addEventListener("change", () => setFileName(distInput.files[0]?.name || ""));
  ["dragover", "dragenter"].forEach(ev =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => {
    const f = e.dataTransfer.files[0];
    if (f) { distInput.files = e.dataTransfer.files; setFileName(f.name); }
  });

  // Aperçu du package déduit (miroir de derivePackage côté serveur).
  function derivePackage(name) {
    let slug = name.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 30);
    if (!slug || !/^[a-z]/.test(slug)) slug = "app" + slug;
    return "app.webview." + slug;
  }
  $("name").addEventListener("input", (e) => {
    const name = e.target.value.trim();
    $("pkg").placeholder = name ? derivePackage(name) : "app.webview.monapplication";
  });

  // Reprise du suivi temps réel au chargement pour les builds non terminés.
  render();
  builds.filter(b => !isTerminal(b.status)).forEach(b => subscribe(b.id));
})();
</script>
</body>
</html>
