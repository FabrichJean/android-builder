name: build-apk

# Le nom du run reprend le build_id : le serveur Go corrèle ainsi la requête
# à l'exécution du workflow.
run-name: apk-${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Identifiant du build (fourni par le serveur)"
        required: true
      app_url:
        description: "URL à encapsuler dans la WebView"
        required: true
      app_name:
        description: "Nom affiché de l'application"
        required: true
      package_id:
        description: "applicationId Android (ex: com.exemple.monapp)"
        required: true
      version_name:
        description: "versionName"
        required: false
        default: "1.0"
      version_code:
        description: "versionCode (entier)"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-template
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Injecter la configuration (applicationId / versions)
        run: |
          sed -i "s|__APPLICATION_ID__|${{ inputs.package_id }}|g" app/build.gradle.kts
          sed -i "s|__VERSION_NAME__|${{ inputs.version_name }}|g"  app/build.gradle.kts
          sed -i "s|__VERSION_CODE__|${{ inputs.version_code }}|g"  app/build.gradle.kts

      - name: Générer strings.xml (nom + URL, échappement XML sûr)
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_URL: ${{ inputs.app_url }}
        run: |
          python3 - <<'PY'
          import os, html
          name = html.escape(os.environ["APP_NAME"], quote=True)
          url  = html.escape(os.environ["APP_URL"],  quote=True)
          with open("app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n')
              f.write('<resources>\n')
              f.write(f'    <string name="app_name">{name}</string>\n')
              f.write(f'    <string name="app_url">{url}</string>\n')
              f.write('</resources>\n')
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          # Persiste ~/.gradle (dépendances + build cache) entre les runs.
          cache-read-only: false

      - name: Build de l'APK debug
        run: gradle assembleDebug --build-cache --configuration-cache

      - name: Renommer l'APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "$RUNNER_TEMP/out/${{ inputs.build_id }}.apk"

      - name: Upload de l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: ${{ runner.temp }}/out/${{ inputs.build_id }}.apk
          retention-days: 7
          if-no-files-found: error
